services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: document-intelligence-engine

    restart: unless-stopped

    expose:
      - "5000"

    env_file:
      - .env

    volumes:
      - .:/app

  web:
    image: nginx:stable-alpine

    container_name: document-intelligence-engine-web

    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app