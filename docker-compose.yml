services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: document-intelligence-engine

    restart: unless-stopped

    expose:
      - "5000"

    env_file:
      - .env

    # Code is mounted so Flask (debug mode) reloads changes without rebuilding.
    volumes:
      - .:/app

    # "Up" is not "ready": `docker compose up --wait` (make up) waits for this.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    image: nginx:stable-alpine

    container_name: document-intelligence-engine-web

    restart: unless-stopped

    # Served at http://document-intelligence.test (requires "127.0.0.1 document-intelligence.test" in /etc/hosts).
    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      app:
        condition: service_healthy
